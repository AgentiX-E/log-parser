name: Benchmark Full

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset name (empty = all 14, "Linux" = CI-compatible default)'
        required: false
        default: 'Linux'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-full"
  cancel-in-progress: false

jobs:
  benchmark-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Full benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p docs/full
          if [ -z "${{ github.event.inputs.dataset }}" ]; then
            npx tsx benchmark/loghub-full.ts --all 2>&1 | tee docs/full/results.txt
          else
            npx tsx benchmark/loghub-full.ts --dataset "${{ github.event.inputs.dataset }}" 2>&1 | tee docs/full/results.txt
          fi

      - name: Generate HTML report
        run: |
          cat > docs/full/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Log-Parser Full Benchmark</title>
          <style>
          :root{--bg:#fff;--fg:#1a1a2e;--accent:#2563eb;--bdr:#e5e7eb;--green:#059669;--red:#dc2626;--muted:#6b7280}
          @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--accent:#60a5fa;--bdr:#334155;--green:#34d399;--red:#f87171;--muted:#94a3b8}}
          body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:2rem;max-width:1200px;margin:auto}
          h1{font-size:1.5rem;border-bottom:2px solid var(--accent);padding-bottom:.5rem}
          pre{background:var(--bdr);padding:1rem;border-radius:6px;overflow-x:auto;font-size:.85rem;line-height:1.5}
          .meta{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
          </style></head>
          <body>
          <h1>Log-Parser LogHub Full Benchmark</h1>
          <p class="meta">Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ") · Dataset: ${{ github.event.inputs.dataset || 'all' }}</p>
          <pre>$(cat docs/full/results.txt)</pre>
          </body></html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: benchmark-full
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

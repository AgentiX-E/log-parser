name: Benchmark Report

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── LogHub-2k benchmark ────────────────────────────────────
  benchmark-2k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run LogHub-2k benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx benchmark/loghub-benchmark.ts 2>&1 | tee /tmp/bench-2k.txt
      - name: Upload 2k artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-2k
          path: /tmp/bench-2k.txt

  # ─── LogHub-2k HTML report ──────────────────────────────────
  report-2k:
    needs: benchmark-2k
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download 2k results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-2k
          path: /tmp
      - name: Generate 2k HTML report
        env:
          OUTPUT_DIR: docs/2k
        run: npx tsx benchmark/report.ts < /tmp/bench-2k.txt
      - name: Upload 2k pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: pages-2k
          path: docs

  # ─── LogHub Full (14 parallel datasets) ─────────────────────
  Proxifier:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Proxifier

  Linux:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Linux

  Apache:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Apache

  Zookeeper:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Zookeeper

  Mac:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Mac

  HealthApp:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: HealthApp

  Hadoop:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Hadoop

  OpenStack:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: OpenStack

  HPC:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: HPC

  OpenSSH:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: OpenSSH

  BGL:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: BGL

  Spark:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Spark

  HDFS:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: HDFS

  Thunderbird:
    uses: ./.github/workflows/_benchmark-full.yml
    with:
      dataset: Thunderbird

  # ─── Aggregate + Pages ───────────────────────────────────────
  pages:
    needs: [report-2k, Proxifier,Linux,Apache,Zookeeper,Mac,HealthApp,Hadoop,
            OpenStack,HPC,OpenSSH,BGL,Spark,HDFS,Thunderbird]
    if: |
      !cancelled() &&
      (needs.report-2k.result == 'success' || needs.report-2k.result == 'skipped') &&
      (needs.Proxifier.result == 'success' || needs.Proxifier.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download 2k report
        uses: actions/download-artifact@v8
        with:
          name: pages-2k
          path: docs

      - name: Download Full results
        uses: actions/download-artifact@v8
        with:
          path: /tmp/full-results
        continue-on-error: true

      - name: Generate Full HTML report
        run: |
          npx tsx benchmark/report-full.ts /tmp/full-results docs/full

      - name: Create landing page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html><html lang="en">
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Log-Parser Benchmarks</title>
          <style>
          :root{--bg:#fff;--fg:#1a1a2e;--accent:#2563eb}
          @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--accent:#60a5fa}}
          body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:800px;margin:4rem auto;padding:0 2rem}
          h1{font-size:2rem;border-bottom:3px solid var(--accent);padding-bottom:.5rem}
          a{display:block;padding:1.5rem;margin:1rem 0;border:2px solid var(--accent);border-radius:8px;text-decoration:none;color:var(--fg);font-size:1.2rem;transition:background .2s}
          a:hover{background:var(--accent);color:#fff}
          .sub{font-size:.9rem;color:var(--muted);margin-top:.3rem}
          </style></head><body>
          <h1>AgentiX-E/log-parser Benchmarks</h1>
          <a href="/log-parser/2k/">LogHub-2k<span class="sub">16 datasets × 2,000 logs · LLM-enhanced comparison</span></a>
          <a href="/log-parser/full/">LogHub Full<span class="sub">14 datasets × up to 16M logs · Production-scale validation · Automated with 2k</span></a>
          </body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: pages
    if: |
      !cancelled() &&
      (needs.pages.result == 'success' || needs.pages.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

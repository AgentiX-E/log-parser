name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1 — Quality Gates
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm config set approve-builds true 2>/dev/null || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2 — OIDC Dry-Run (pre-validate token exchange before real publish)
  # ═══════════════════════════════════════════════════════════════════════════
  oidc-check:
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify OIDC environment variables
        run: |
          echo "::group::OIDC Token Diagnostics"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "❌ ACTIONS_ID_TOKEN_REQUEST_URL is empty"
            exit 1
          fi
          echo "✓ ACTIONS_ID_TOKEN_REQUEST_URL is set"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "❌ ACTIONS_ID_TOKEN_REQUEST_TOKEN is empty"
            exit 1
          fi
          echo "✓ ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"
          echo "::endgroup::"

      - name: Pre-check npm registry connectivity
        run: |
          echo "::group::npm Registry Connectivity"
          npm ping || { echo "❌ Cannot reach npm registry"; exit 1; }
          echo "✓ npm registry reachable"
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3 — Publish npm Packages (OIDC + provenance)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-npm:
    needs: oidc-check
    if: ${{ !cancelled() && needs.oidc-check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm config set approve-builds true 2>/dev/null || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # npm 10.x (bundled with node 22) uses .npmrc authToken instead of
      # OIDC token for the PUT to registry, causing E404 after successful
      # provenance signing.  npm 11.x (node 24) natively supports OIDC.
      - name: Publish all packages to npm (OIDC + provenance)
        shell: bash
        run: |
          set -euo pipefail

          PKGS=(
            packages/log-parser-core
            packages/log-parser-node
            packages/log-parser-browser
            packages/log-parser-llm
            packages/log-parser-webllm
            packages/log-parser-cli
            packages/log-parser-server
          )

          FAILED=()
          PUBLISHED=()
          SKIPPED=()

          for pkg in "${PKGS[@]}"; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Processing: ${pkg}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd "${pkg}"

            PKG_NAME="$(node -p "require('./package.json').name")"
            PKG_VER="$(node -p "require('./package.json').version")"

            echo "  Package: ${PKG_NAME}"
            echo "  Version: ${PKG_VER}"

            # Check if dist/ exists
            if [ ! -d "dist" ]; then
              echo "  ❌ dist/ not found — package not built"
              FAILED+=("${PKG_NAME}")
              cd ../..
              continue
            fi

            # Check if version already published
            if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
              echo "  ⚠ ${PKG_NAME}@${PKG_VER} already published — skipping"
              SKIPPED+=("${PKG_NAME}")
              cd ../..
              continue
            fi

            # Publish with provenance
            echo "  🚀 Publishing ${PKG_NAME}@${PKG_VER} with provenance..."
            if npm publish --access public --provenance; then
              echo "  ✅ ${PKG_NAME}@${PKG_VER} published"
              PUBLISHED+=("${PKG_NAME}")
            else
              echo "  ❌ Failed to publish ${PKG_NAME}@${PKG_VER}"
              FAILED+=("${PKG_NAME}")
            fi

            cd ../..
          done

          # ── Summary ──
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "                    PUBLISH SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          echo "✅ Published: ${#PUBLISHED[@]}"
          for p in "${PUBLISHED[@]}"; do echo "   • ${p}"; done
          echo ""
          echo "⚠ Skipped: ${#SKIPPED[@]}"
          for p in "${SKIPPED[@]}"; do echo "   • ${p}"; done
          echo ""
          echo "❌ Failed: ${#FAILED[@]}"
          for p in "${FAILED[@]}"; do echo "   • ${p}"; done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "Some packages failed to publish."
            exit 1
          fi

          echo ""
          echo "🎉 All packages published successfully!"

      - name: npm publish summary
        if: always()
        run: |
          echo "### 📦 npm Packages Published" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          for pkg in packages/log-parser-core packages/log-parser-node packages/log-parser-browser packages/log-parser-llm packages/log-parser-webllm packages/log-parser-cli packages/log-parser-server; do
            name=$(node -p "require('./${pkg}/package.json').name")
            version=$(node -p "require('./${pkg}/package.json').version")
            echo "| \`${name}\` | ${version} |" >> $GITHUB_STEP_SUMMARY
          done
